version: 2
scenario: bod-cuas-golden
seed: 42
clock: deterministic
protected_volumes: ./protected-volumes.yaml
acceptance_metrics:
  reliable_decision_time_s_min: 30
  track_continuity_pct_min: 95
  stale_track_max_ms: 5000
  require_sensor_degradation_visibility: true
  require_contract_correlated_safe_hold_evidence: true

# This is a trace of replay.py's emitted stimuli/read-model transitions.
# Expected Core/S1 outputs are named only where the verifiers observe them.
# The simulation-only S1 injector validates Core's abort against its retained
# delegation, then emits contract-correlated safe-hold evidence.
steps:
  - at_s: 0
    id: scenario-start
    subject: scenario.status
    event: running
    c2_context_phase: surveillance

  - at_s: 1
    id: authorized-inspection-uas
    subject: surveillance.observation
    track_id: "7001"
    expected_authorization: authorized

  - at_s: 2
    id: unknown-cooperative-uas
    subject: surveillance.observation
    track_id: "7002"
    expected_authorization: unknown

  - at_s: 3
    id: unauthorized-cooperative-uas
    subject: surveillance.observation
    track_id: "7003"
    expected_authorization: unauthorized

  - at_s: 4
    id: rogue-detected
    subject: surveillance.observation
    track_id: "4660"
    classification: non_cooperative_target

  - at_s: 5
    id: sensor-degraded
    subject: surveillance.sensor.status
    sensor: radar-low-altitude
    status: degraded
    assertion: threat_must_not_clear_from_sensor_loss_alone

  - at_s: 25
    id: rf-origin-observations
    subject: surveillance.origin.bearing
    track_id: "4660"
    sensors: [rf-sensor-01, rf-sensor-02]

  - at_s: 26
    id: rf-tdoa-fix
    subject: surveillance.origin.tdoa_fix
    track_id: "4660"

  - at_s: 30
    id: acoustic-corroboration-and-assessment-context
    subject: cuas.operational.context
    c2_context_phase: assessment
    track_id: "4660"
    predicted_entry_in_ms: 37000
    runway_or_sector: RWY23

  - at_s: 44
    id: fresh-rogue-observation
    subject: surveillance.observation
    track_id: "4660"
    velocity_ned_mm_s: [1200, -300, 0]

  - at_s: 44.5
    id: replay-authorization-fallback
    subject: operator.action.authorized
    track_id: "4660"
    action: intercept
    expected_authoritative_output: furia.s1.mission-delegation

  - at_s: 44.6
    id: bounded-execution-context
    subject: cuas.operational.context
    c2_context_phase: bounded_execution
    authority_posture: bounded_intercept

  - at_s: 54.5
    id: comms-loss-injection
    subject: s1.sim.execution-health
    comms_available: false
    expected_execution_evidence: active/lost_link_continuation

  - at_s: 54.6
    id: bounded-continuation-context
    subject: cuas.operational.context
    c2_context_phase: bounded_continuation

  - at_s: 64.5
    id: comms-recovery-injection
    subject: s1.sim.execution-health
    comms_available: true
    expected_execution_evidence: active/normal

  - at_s: 74.4
    id: civilian-conflict-context
    subject: cuas.operational.context
    c2_context_phase: safety_abort_pending_execution_evidence
    flight_id: AFR762
    policy: BOD-RWY-FRATRICIDE-003

  - at_s: 74.5
    id: civilian-conflict-stimulus
    subject: safety.civilian_aircraft_conflict
    flight_id: AFR762
    track_id: "4660"
    expected_authoritative_output: swarm.command.abort
    expected_execution_evidence: aborted/safety_hold (contract-correlated)

  - at_s: 94.5
    id: scenario-complete
    subject: scenario.status
    event: complete
    note: Core abort and contract-correlated S1 safe-hold evidence are required acceptance evidence.
